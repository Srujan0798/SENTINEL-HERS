name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Run tests
        run: pytest -q -W ignore::DeprecationWarning --tb=short
        env:
          DATABASE_URL: "sqlite:///./sentinel_test.db"
          JWT_SECRET: "ci-secret-key-long-enough-32ch!!"
          JWT_REFRESH_SECRET: "ci-refresh-long-enough-32ch!!"
          REDIS_URL: ""

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Run linter
        run: npm run lint
        working-directory: src/frontend
