openapi: 3.1.0
info:
  title: SENTINEL — AI-Native Engineering Operations Platform
  description: |
    Unified API for incident management, log monitoring, deployment tracking,
    AI-assisted debugging, and team collaboration.
  version: 1.0.0
  contact:
    name: SENTINEL Team
  license:
    name: MIT

servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.sentinel.dev/api/v1
    description: Development

tags:
  - name: auth
    description: Authentication & authorization
  - name: teams
    description: Team management
  - name: incidents
    description: Incident lifecycle management
  - name: logs
    description: Log ingestion & search
  - name: alerts
    description: Alert management
  - name: health
    description: Service health monitoring
  - name: deployments
    description: Deployment tracking
  - name: commits
    description: Commit & VCS integration
  - name: timeline
    description: Timeline events & provenance
  - name: tasks
    description: Task assignment & tracking
  - name: sla
    description: SLA management
  - name: channels
    description: Communication channels
  - name: messages
    description: Channel messages
  - name: ai
    description: AI-powered features
  - name: analytics
    description: Analytics & dashboards
  - name: integrations
    description: External integrations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ──────────────────────────────────────────────
    # Common
    # ──────────────────────────────────────────────
    UUID:
      type: string
      format: uuid

    Timestamp:
      type: string
      format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
        total_pages:
          type: integer

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: string
        code:
          type: string

    # ──────────────────────────────────────────────
    # Teams & Auth
    # ──────────────────────────────────────────────
    Team:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        settings:
          type: object
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    Role:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        description:
          type: string

    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        team_id:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
          format: email
        name:
          type: string
        avatar_url:
          type: string
          nullable: true
        role_id:
          $ref: '#/components/schemas/UUID'
        role:
          $ref: '#/components/schemas/Role'
        is_active:
          type: boolean
        last_login_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: bearer
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    RegisterRequest:
      type: object
      required: [email, password, name, team_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
        team_name:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    # ──────────────────────────────────────────────
    # Incidents
    # ──────────────────────────────────────────────
    SeverityLevel:
      type: string
      enum: [SEV1, SEV2, SEV3, SEV4]

    IncidentStatus:
      type: string
      enum: [detected, triaging, investigating, mitigating, resolved, closed]

    Incident:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        team_id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
        description:
          type: string
        severity:
          $ref: '#/components/schemas/SeverityLevel'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        assigned_to:
          $ref: '#/components/schemas/UUID'
        escalated_to:
          $ref: '#/components/schemas/UUID'
        detected_at:
          $ref: '#/components/schemas/Timestamp'
        triaged_at:
          $ref: '#/components/schemas/Timestamp'
        resolved_at:
          $ref: '#/components/schemas/Timestamp'
        closed_at:
          $ref: '#/components/schemas/Timestamp'
        root_cause:
          type: string
        ai_summary:
          type: string
        ai_root_cause_ranking:
          type: array
          items:
            type: object
            properties:
              cause:
                type: string
              confidence:
                type: number
        metadata:
          type: object
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    IncidentCreate:
      type: object
      required: [title, severity]
      properties:
        title:
          type: string
          maxLength: 500
        description:
          type: string
        severity:
          $ref: '#/components/schemas/SeverityLevel'
        assigned_to:
          $ref: '#/components/schemas/UUID'
        metadata:
          type: object

    IncidentUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        severity:
          $ref: '#/components/schemas/SeverityLevel'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        assigned_to:
          $ref: '#/components/schemas/UUID'
        escalated_to:
          $ref: '#/components/schemas/UUID'
        root_cause:
          type: string

    # ──────────────────────────────────────────────
    # Logs
    # ──────────────────────────────────────────────
    LogLevel:
      type: string
      enum: [debug, info, warn, error, fatal]

    LogEntry:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        team_id:
          $ref: '#/components/schemas/UUID'
        incident_id:
          $ref: '#/components/schemas/UUID'
        service:
          type: string
        level:
          $ref: '#/components/schemas/LogLevel'
        message:
          type: string
        metadata:
          type: object
        source_ip:
          type: string
        indexed_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    LogIngest:
      type: object
      required: [service, level, message]
      properties:
        service:
          type: string
        level:
          $ref: '#/components/schemas/LogLevel'
        message:
          type: string
        metadata:
          type: object
        source_ip:
          type: string

    LogSearchQuery:
      type: object
      properties:
        query:
          type: string
        service:
          type: string
        level:
          $ref: '#/components/schemas/LogLevel'
        start_time:
          $ref: '#/components/schemas/Timestamp'
        end_time:
          $ref: '#/components/schemas/Timestamp'
        page:
          type: integer
        per_page:
          type: integer

    # ──────────────────────────────────────────────
    # Alerts
    # ──────────────────────────────────────────────
    Alert:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        team_id:
          $ref: '#/components/schemas/UUID'
        incident_id:
          $ref: '#/components/schemas/UUID'
        source:
          type: string
        alert_type:
          type: string
        title:
          type: string
        description:
          type: string
        severity:
          $ref: '#/components/schemas/SeverityLevel'
        is_resolved:
          type: boolean
        resolved_at:
          $ref: '#/components/schemas/Timestamp'
        resolved_by:
          $ref: '#/components/schemas/UUID'
        fired_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    AlertCreate:
      type: object
      required: [source, alert_type, title]
      properties:
        source:
          type: string
        alert_type:
          type: string
        title:
          type: string
        description:
          type: string
        severity:
          $ref: '#/components/schemas/SeverityLevel'
        metadata:
          type: object

    # ──────────────────────────────────────────────
    # Service Health
    # ──────────────────────────────────────────────
    HealthStatus:
      type: string
      enum: [healthy, degraded, down, unknown]

    ServiceHealth:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        team_id:
          $ref: '#/components/schemas/UUID'
        service_name:
          type: string
        status:
          $ref: '#/components/schemas/HealthStatus'
        uptime_percentage:
          type: number
        latency_ms:
          type: integer
        last_check_at:
          $ref: '#/components/schemas/Timestamp'
        next_check_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    ServiceHealthUpdate:
      type: object
      required: [service_name, status]
      properties:
        service_name:
          type: string
        status:
          $ref: '#/components/schemas/HealthStatus'
        uptime_percentage:
          type: number
        latency_ms:
          type: integer

    # ──────────────────────────────────────────────
    # Deployments & Commits
    # ──────────────────────────────────────────────
    DeployStatus:
      type: string
      enum: [pending, in_progress, success, failed, rolled_back]

    Deployment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        team_id:
          $ref: '#/components/schemas/UUID'
        service:
          type: string
        version:
          type: string
        environment:
          type: string
        status:
          $ref: '#/components/schemas/DeployStatus'
        deployed_by:
          $ref: '#/components/schemas/UUID'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        rollback_at:
          $ref: '#/components/schemas/Timestamp'
        commit_id:
          $ref: '#/components/schemas/UUID'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    DeploymentCreate:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
        version:
          type: string
        environment:
          type: string
          default: production
        metadata:
          type: object

    Commit:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        team_id:
          $ref: '#/components/schemas/UUID'
        deployment_id:
          $ref: '#/components/schemas/UUID'
        sha:
          type: string
        message:
          type: string
        author:
          type: string
        author_email:
          type: string
        branch:
          type: string
        repository:
          type: string
        committed_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    # ──────────────────────────────────────────────
    # Timeline Events
    # ──────────────────────────────────────────────
    TimelineEvent:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        incident_id:
          $ref: '#/components/schemas/UUID'
        event_type:
          type: string
        source:
          type: string
        actor:
          type: string
        ts:
          $ref: '#/components/schemas/Timestamp'
        payload_ref:
          type: string
        description:
          type: string
        metadata:
          type: object
        created_at:
          $ref: '#/components/schemas/Timestamp'

    TimelineEventCreate:
      type: object
      required: [event_type, source, actor]
      properties:
        event_type:
          type: string
        source:
          type: string
        actor:
          type: string
        payload_ref:
          type: string
        description:
          type: string
        metadata:
          type: object

    # ──────────────────────────────────────────────
    # Tasks
    # ──────────────────────────────────────────────
    TaskStatus:
      type: string
      enum: [pending, in_progress, blocked, completed, cancelled]

    Task:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        incident_id:
          $ref: '#/components/schemas/UUID'
        assigned_to:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          type: integer
          minimum: 1
          maximum: 5
        due_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        completed_by:
          $ref: '#/components/schemas/UUID'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    TaskCreate:
      type: object
      required: [title]
      properties:
        incident_id:
          $ref: '#/components/schemas/UUID'
        assigned_to:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
          maxLength: 500
        description:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        due_at:
          $ref: '#/components/schemas/Timestamp'

    TaskUpdate:
      type: object
      properties:
        assigned_to:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          type: integer

    # ──────────────────────────────────────────────
    # SLA
    # ──────────────────────────────────────────────
    SLA:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        team_id:
          $ref: '#/components/schemas/UUID'
        incident_id:
          $ref: '#/components/schemas/UUID'
        severity:
          $ref: '#/components/schemas/SeverityLevel'
        target_minutes:
          type: integer
        elapsed_minutes:
          type: integer
        is_breached:
          type: boolean
        breached_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        paused_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    # ──────────────────────────────────────────────
    # Channels & Messages
    # ──────────────────────────────────────────────
    Channel:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        incident_id:
          $ref: '#/components/schemas/UUID'
        team_id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        channel_type:
          type: string
        is_archived:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    Message:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        channel_id:
          $ref: '#/components/schemas/UUID'
        user_id:
          $ref: '#/components/schemas/UUID'
        content:
          type: string
        message_type:
          type: string
        is_ai_generated:
          type: boolean
        ai_provider:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'

    MessageCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string
        message_type:
          type: string
          default: text

    # ──────────────────────────────────────────────
    # Anomaly Scores
    # ──────────────────────────────────────────────
    AnomalyScore:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        team_id:
          $ref: '#/components/schemas/UUID'
        service:
          type: string
        metric_name:
          type: string
        score:
          type: number
        threshold:
          type: number
        is_anomaly:
          type: boolean
        detected_at:
          $ref: '#/components/schemas/Timestamp'
        incident_id:
          $ref: '#/components/schemas/UUID'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    # ──────────────────────────────────────────────
    # AI
    # ──────────────────────────────────────────────
    AISummaryRequest:
      type: object
      required: [incident_id]
      properties:
        incident_id:
          $ref: '#/components/schemas/UUID'

    AISummaryResponse:
      type: object
      properties:
        summary:
          type: string
        root_cause_ranking:
          type: array
          items:
            type: object
            properties:
              cause:
                type: string
              confidence:
                type: number
              evidence:
                type: string
        provider:
          type: string
        generated_at:
          $ref: '#/components/schemas/Timestamp'

    AIChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        incident_id:
          $ref: '#/components/schemas/UUID'
        context:
          type: object

    AIChatResponse:
      type: object
      properties:
        response:
          type: string
        provider:
          type: string
        sources:
          type: array
          items:
            type: object

    # ──────────────────────────────────────────────
    # Analytics
    # ──────────────────────────────────────────────
    IncidentMetrics:
      type: object
      properties:
        total_incidents:
          type: integer
        by_severity:
          type: object
          properties:
            SEV1:
              type: integer
            SEV2:
              type: integer
            SEV3:
              type: integer
            SEV4:
              type: integer
        by_status:
          type: object
        mttr_minutes:
          type: number
        sla_breach_rate:
          type: number

    TimeSeriesPoint:
      type: object
      properties:
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        value:
          type: number

    # ──────────────────────────────────────────────
    # Integrations
    # ──────────────────────────────────────────────
    WebhookPayload:
      type: object
      properties:
        event:
          type: string
        payload:
          type: object
        source:
          type: string

security:
  - bearerAuth: []

paths:
  # ──────────────────────────────────────────────
  # Auth
  # ──────────────────────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      summary: Register new user and team
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [auth]
      summary: Login and get tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [auth]
      summary: Get current user profile
      operationId: getCurrentUser
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ──────────────────────────────────────────────
  # Teams
  # ──────────────────────────────────────────────
  /teams:
    get:
      tags: [teams]
      summary: List teams
      operationId: listTeams
      responses:
        '200':
          description: Teams list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'

  /teams/{team_id}:
    get:
      tags: [teams]
      summary: Get team details
      operationId: getTeam
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'

  # ──────────────────────────────────────────────
  # Incidents
  # ──────────────────────────────────────────────
  /incidents:
    get:
      tags: [incidents]
      summary: List incidents
      operationId: listIncidents
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IncidentStatus'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/SeverityLevel'
        - name: assigned_to
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Incidents list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Incident'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags: [incidents]
      summary: Create incident
      operationId: createIncident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentCreate'
      responses:
        '201':
          description: Incident created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

  /incidents/{incident_id}:
    get:
      tags: [incidents]
      summary: Get incident details
      operationId: getIncident
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Incident details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

    patch:
      tags: [incidents]
      summary: Update incident
      operationId: updateIncident
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentUpdate'
      responses:
        '200':
          description: Incident updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

