# SENTINEL — Render Blueprint (Infrastructure as Code)
# Deploys: FastAPI backend (Docker) + managed PostgreSQL + managed Redis (Key Value).
# Frontend is deployed separately on Vercel (see docs/DEPLOYMENT.md).
#
# Apply:  Render Dashboard → New → Blueprint → point at this repo → Apply.
# Secrets marked `sync: false` are NEVER stored in git — set them in the Render
# dashboard after the first apply (FM-07).
#
# Validate locally:
#   python -c "import yaml; yaml.safe_load(open('render.yaml')); print('render.yaml valid')"

databases:
  - name: sentinel-postgres
    databaseName: sentinel
    user: sentinel
    plan: free
    postgresMajorVersion: "16"

services:
  # --- Managed Redis (Render Key Value) ---------------------------------------
  - type: keyvalue
    name: sentinel-redis
    plan: free
    # Restrict network access to Render internal services only.
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # --- FastAPI backend --------------------------------------------------------
  - type: web
    name: sentinel-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /healthz
    # Pre-deploy: migrate + seed demo (idempotent). Runs in the built image with
    # DATABASE_URL / REDIS_URL injected, before the new version is promoted.
    preDeployCommand: ./deployment/render/release.sh
    autoDeploy: true
    envVars:
      # Render injects the port the container must bind (Dockerfile binds 0.0.0.0:$PORT).
      - key: PORT
        value: "8000"

      # DB + cache — injected from the managed resources above (never hardcoded).
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sentinel-redis
          property: connectionString

      # Auth — generated by Render, never in git.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # AI layer — set in the dashboard (sync: false = dashboard-only secret).
      # Supports: claude, gemini, openrouter, nvidia. Default: mock (no key needed).
      - key: AI_PROVIDER
        value: openrouter
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVAPI_KEY
        sync: false

      # Integrations — dashboard-only secrets (optional).
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITLAB_WEBHOOK_SECRET
        sync: false

      # CORS — production frontend origin (comma-separated if multiple).
      - key: CORS_ORIGINS
        value: "https://sentinel-hers.vercel.app"

      # Demo seed — boot + preDeploy ensure demo@sentinel.io + SEV1 exist.
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: SEED_SECRET
        generateValue: true
      - key: ENV
        value: production
      - key: ALLOW_MOCK_AI
        value: "1"
